<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>싸중싸 그리기 대작전</title><style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');*{box-sizing:border-box}body{margin:0;font-family:'Gaegu','Malgun Gothic',sans-serif;color:#40352e;background:repeating-linear-gradient(0deg,transparent 0 31px,#a5c7df50 32px,#a5c7df50 33px),linear-gradient(120deg,#fff9e9,#f5e7c8);min-height:100vh}button,input{font:inherit}button{cursor:pointer}main{max-width:1150px;margin:auto;padding:24px 14px 50px}.paper{background:#fffdf6;border:3px solid #443b35;border-radius:15px;box-shadow:7px 8px 0 #d2b58b;position:relative;padding:24px;text-align:center}.tape{position:absolute;top:-14px;left:44%;width:95px;height:26px;background:#f8c8a7b0;transform:rotate(-5deg)}h1{font-size:clamp(44px,9vw,78px);line-height:1.02;margin:20px 0 5px;text-shadow:3px 3px #ffce78}h2{font-size:40px;margin:5px 0}.sub{font-size:25px;color:#8c7565;margin:6px}.mascot{width:min(260px,60vw);mix-blend-mode:multiply}.btn{border:3px solid #443b35;border-radius:14px;padding:8px 22px;background:#f9cb67;box-shadow:3px 4px 0 #493d35;font-size:26px;font-weight:700}.btn.secondary{background:#c5e5f3}.btn.pink{background:#f6bac8}.btn:disabled{opacity:.4;cursor:not-allowed}.stack,.toolbar{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:15px 0}.hidden{display:none!important}input{border:2px solid #5d514a;border-radius:11px;padding:9px 12px;font-size:25px;width:min(100%,350px);background:#fff;text-align:center}.avatars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:720px;margin:18px auto}.avatar{border:3px solid #e2d8c9;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-width:0;font-size:23px;font-weight:bold}.avatar.selected{border-color:#ec9e43;background:#fff1d2}.avatar img{display:block;width:100%;height:135px;object-fit:contain;object-position:center}.hint{font-size:22px;color:#88776a}.players{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}.player{display:flex;align-items:center;gap:7px;border:2px dashed #86b6cf;background:#eaf5fc;border-radius:13px;padding:6px 10px;font-size:22px}.player img{width:52px;height:52px;object-fit:contain}.player.drawer{border-color:#e9a34d;background:#fff0cd}.gamegrid{display:grid;grid-template-columns:minmax(0,2fr) minmax(230px,1fr);gap:14px;text-align:left}.canvaswrap{min-width:0}canvas{display:block;width:100%;height:auto;background:white;border:3px solid #51473f;border-radius:11px;touch-action:none}.chat{background:#fff8e7;border:2px solid #b8a58d;border-radius:12px;padding:12px;display:flex;flex-direction:column;min-height:350px}.messages{flex:1;min-height:0;height:290px;overflow-y:auto;font-size:21px}.messages p{margin:4px 0;overflow-wrap:anywhere}.chatrow{display:flex;gap:4px}.chatrow input{min-width:0;width:100%;font-size:20px;text-align:left}.chatrow .btn{font-size:20px;padding:5px 9px}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.pill{background:#f9e7bd;border:2px solid #665344;border-radius:12px;padding:4px 13px;font-size:26px}.secret{font-size:33px;color:#b95b49;font-weight:bold;margin:8px}.swatch{width:34px;height:34px;border:2px solid #444;border-radius:50%;padding:0}.toolbtn.chosen{background:#b9e4c7;box-shadow:inset 0 0 0 2px #41835a}.swatch.active{outline:3px solid #efb34e;outline-offset:2px}.roomcode{font-size:48px;letter-spacing:6px;color:#c8794b;font-weight:bold}.status{font-size:24px;color:#9b6c48}.notice{font-size:28px;color:#ba654e;font-weight:bold;min-height:35px}@media(max-width:750px){.gamegrid{grid-template-columns:1fr}.avatars{grid-template-columns:repeat(2,1fr)}.paper{padding:14px}.avatar img{height:120px}.messages{height:150px}.chat{min-height:210px}}
</style></head><body><main>
<section id="home" class="paper"><div class="tape"></div><h1>싸중싸<br>그리기 대작전!</h1><p class="sub">친구들이랑 우당탕탕 그림 맞히기 🎨</p><img class="mascot" src="/mascot.png" alt="메인 캐릭터"><p style="font-size:32px">🖍️ ✏️ 🎨 🖌️</p><button class="btn" id="enterBtn">게임 입장하기</button></section>
<section id="profile" class="paper hidden"><div class="tape"></div><h2>내 캐릭터 만들기</h2><p class="sub">닉네임을 적고 프사를 골라줘!</p><input id="nickname" maxlength="12" placeholder="닉네임 입력"><div class="avatars" id="avatars"></div><p class="hint">프로필을 선택하면 아래 버튼을 눌러줘!</p><div class="stack"><button class="btn secondary" id="backBtn">뒤로</button><button class="btn" id="joinBtn">입장하기</button></div></section>
<section id="lobby" class="paper hidden"><div class="tape"></div><h2>우리들의 그림방 🏠</h2><p class="sub">방 코드</p><div class="roomcode" id="roomcode"></div><div class="stack"><button class="btn secondary" id="copyBtn">친구 초대 링크 복사 📋</button><button class="btn" id="startBtn">게임 시작 🎨</button></div><p class="hint">최소 2명 입장하면 방장이 시작할 수 있어!</p><div class="players" id="lobbyplayers"></div></section>
<section id="game" class="paper hidden"><div class="tape"></div><div class="topline"><span class="pill" id="round">🎨 1라운드</span><span class="pill" id="timer">⏱ 60초</span></div><div id="role" class="status"></div><div id="secret" class="secret"></div><div id="notice" class="notice"></div><div class="players" id="gameplayers"></div><div class="gamegrid"><div class="canvaswrap"><canvas id="board" width="720" height="500"></canvas><div id="drawtools" class="hidden"><div class="toolbar" id="colors"></div><div class="toolbar"><span style="font-size:22px">펜 굵기</span><button class="btn secondary toolbtn" data-brush="3">얇게</button><button class="btn secondary toolbtn" data-brush="6">중간</button><button class="btn secondary toolbtn" data-brush="15">두껍게</button><button class="btn secondary toolbtn" id="fillBtn">🪣 페인트통</button><button class="btn secondary" id="eraseBtn">지우개</button><button class="btn pink" id="clearBtn">전체 지우기</button></div></div></div><div class="chat"><strong style="font-size:27px">💬 정답 채팅</strong><div class="messages" id="messages"></div><div class="chatrow"><input id="chatinput" placeholder="정답 입력" maxlength="70"><button class="btn" id="sendBtn">전송</button></div></div></div></section>
</main><script src="/app.js" defer></script></body></html>
